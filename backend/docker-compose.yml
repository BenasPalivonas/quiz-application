services:
  postgres:
    image: postgres:16-alpine
    container_name: quiz-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: quiz
      POSTGRES_USER: quiz
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - quiz-postgres-data:/var/lib/postgresql/data

volumes:
  quiz-postgres-data:
